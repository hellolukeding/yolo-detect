# YOLO 推流服务配置文件
# 请根据实际情况修改以下配置

# ============== 摄像头配置 ==============
# 网络摄像头 RTSP 地址 (如果存在，将优先使用)
# 格式: rtsp://username:password@ip:port/path
# 示例: rtsp://admin:123456@192.168.1.100:554/stream1
RTSP_URL=""

# USB 摄像头设备 (自动检测，通常为 /dev/video0)
# USB_CAMERA="/dev/video0"

# ============== 推流配置 ==============
# 推流目标服务器
PUSH_HOST="115.120.237.79"
PUSH_PORT=5004

# ============== 模型配置 ==============
# 性能预设 (full/standard/performance/minimal)
# full: 所有功能 (行人+人脸+表情+年龄) - 需要较好硬件
# standard: 标准配置 (行人+人脸+表情) - 推荐
# performance: 性能优先 (仅行人检测) - 低配服务器
# minimal: 最小配置 (仅行人检测)
MODEL_PRESET="standard"

# 模型路径 (相对于项目根目录)
MODEL_PATH="models/person_detector.pt"

# 检测置信度阈值 (0-1)
CONFIDENCE=0.5

# IOU 阈值 (0-1)
IOU=0.45

# 推理设备 (cpu/mps/cuda)
# 低配置服务器建议使用 cpu
DEVICE="cpu"

# ============== 视频配置 ==============
# 视频分辨率
VIDEO_WIDTH=640
VIDEO_HEIGHT=480

# 帧率 (低配置服务器建议 10-15)
FPS=15

# 比特率 kbps (低网络环境建议 300-500)
BITRATE=500

# ============== 日志配置 ==============
# 日志级别 (DEBUG/INFO/WARNING/ERROR)
LOG_LEVEL="INFO"

# 日志目录
LOG_DIR="/opt/yolo-detect/logs"

# ============== 系统资源限制 ==============
# 最大内存使用 (MB)
MAX_MEMORY=1024

# CPU 限制百分比 (1-100)
CPU_QUOTA=50
