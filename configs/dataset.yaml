# CityPersons Dataset Configuration for YOLO
# 城市街景行人检测数据集

# 数据集根目录
path: /opt/2026/yolo-detect/datasets/citypersons/yolo_dir

# 训练集和验证集（相对于 path 的路径）
train: train/images  # 训练集图片目录
val: valid/images    # 验证集图片目录

# 类别数量
nc: 2

# 类别名称
names:
  0: pedestrian  # 行人
  1: rider       # 骑行者（自行车/摩托车）

# 数据集信息
# - 数据来源: CityPersons (基于 Cityscapes)
# - 总样本数: 2,941 张图片
#   - 训练集: 2,500 张
#   - 验证集: 441 张
# - 标注数量:
#   - pedestrian: 4,476
#   - rider: 16,526
# - 图片格式: PNG
# - 图片尺寸: 2048 x 1024
# - 场景: 城市街景，多尺度行人
# - 配置更新: 2026-03-19
